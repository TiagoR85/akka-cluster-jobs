name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build, Test & Coverage
    uses: TiagoR85/ci-pipeline-templates/.github/workflows/reusable-dotnet-ci.yml@v1
    with:
      dotnet-version: "10.0.x"
      test-project: test/AkkaClusterJobs.Tests/AkkaClusterJobs.Tests.csproj
      coverage-threshold: "80"

  e2e:
    name: E2E Docker Cluster
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - name: Start 3-node cluster
        run: docker compose up -d --build

      - name: Run E2E assertions
        run: |
          chmod +x e2e/assert.sh
          ./e2e/assert.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v